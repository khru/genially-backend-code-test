version: 2
updates:
    - package-ecosystem: "npm"
      directory: "/"
      schedule:
          interval: "daily"
          time: "06:00"
          timezone: "Europe/Madrid"
      open-pull-requests-limit: 5
      allow:
          - dependency-type: "development"
      commit-message:
          prefix: "npm"
          include: "scope"
      labels:
          - "npm"
          - "dependencies"
      assignees:
          - "khru"
      reviewers:
          - "khru"
      versioning-strategy: "auto"
