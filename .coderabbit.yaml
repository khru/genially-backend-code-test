language: en-US
tone_instructions: TDD as design start with a red test, make it green with the simplest change, then refactor. Let tests shape APIs and seams. Prefer small, safe refactors and concrete diffs. Call out bugs, security, and perf, bias to clarity, low coupling, cohesion.
reviews:
  profile: assertive
  review_status: true
  commit_status: true
  fail_commit_status: false
  request_changes_workflow: false
  high_level_summary: true
  changed_files_summary: true
  sequence_diagrams: true
  estimate_code_review_effort: true
  suggested_labels: true
  auto_apply_labels: false
  related_issues: true
  related_prs: true
  suggested_reviewers: true
  auto_assign_reviewers: false

  auto_review:
    enabled: true
    drafts: false
    base_branches: ["main"]
    auto_incremental_review: true

  path_filters:
    - "!node_modules/**"
    - "!dist/**"
    - "!coverage/**"

  tools:
    eslint: { enabled: true }
    semgrep: { enabled: true }
    shellcheck: { enabled: true }
    actionlint: { enabled: true }
    gitleaks: { enabled: true }

  path_instructions:
    - path: "src/**/*.ts"
      instructions: >
        TDD-as-design & maintainability:
        - Let tests drive public APIs and module seams; keep units small and cohesive.
        - Enforce separation of concerns across domain/application/infrastructure; prefer composition over inheritance.
        - Apply SOLID/DRY/KISS/YAGNI; depend on abstractions (ports) not concretions.
        - Suggest small refactorings (extract/inline/rename, parameter objects, remove dead code, clarify side effects).
        - Keep state local; minimize globals; design for test seams and explicit boundaries.
        - Also call out likely bugs, security pitfalls (injection, unsafe defaults, secret leakage) and perf issues.

    - path: "tests/**/*.ts"
      instructions: >
        Tests & TDD:
        - Follow RED→GREEN→REFACTOR; describe behavior (AAA / Given-When-Then).
        - Keep tests fast and deterministic; prefer narrow integration for adapters and black-box acceptance for API.
        - Avoid brittle over-mocking; use in-memory fakes or testcontainers only at boundaries.
        - Improve naming/intent; one reason to fail per test unless covering an end-to-end scenario.

    - path: "src/contexts/**/domain/**"
      instructions: >
        Domain purity:
        - Keep domain free of I/O and frameworks. Enforce invariants and value objects.
        - Prefer intention-revealing names and ubiquitous language.

    - path: "src/contexts/**/(application|usecases|services)/**"
      instructions: >
        Application services:
        - Orchestrate domain; define ports; handle transactions/errors here.
        - Return simple DTOs; keep framework concerns out.

    - path: "src/contexts/**/(infrastructure|adapters|drivers|gateways)/**"
      instructions: >
        Ports & Adapters:
        - Implement adapters against ports; isolate DB/HTTP/framework details.
        - Keep mapping thin and explicit; add contract/boundary tests.

    - path: ".github/workflows/**/*.y?(a)ml"
      instructions: >
        CI/CD DX (advisory only):
        - Keep feedback fast (<5–7 min PR smoke), least-privilege permissions, pinned actions,
          timeouts, concurrency groups, and correct caching.
        - Prefer reusable/composite actions; clear, actionable errors; skip docs-only changes.
        - Do not block merges; checks should inform, not gate, unless explicitly required.

    - path: "scripts/**/*.sh"
      instructions: >
        Shell quality:
        - Quote expansions, consider `set -Eeuo pipefail`, avoid UUoC; prefer POSIX where possible.
        - Keep scripts readable; validate inputs; avoid non-portable constructs.

pre_merge_checks:
  title: { mode: warning }
  description: { mode: warning }
